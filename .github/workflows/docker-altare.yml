name: Build & Push Altare Docker Image

on:
  push:
    branches:
      - d-dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: VITE_SUPABASE_URL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/doando1802/ca-van-nghe:d-dev
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
            VITE_VOICE_TURN_CREDENTIAL_URL=${{ secrets.VITE_VOICE_TURN_CREDENTIAL_URL || vars.VITE_VOICE_TURN_CREDENTIAL_URL }}
            VITE_ENABLE_SERVER_KARAOKE_DOWNLOAD=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
